name: Gate Evidence Check

# PRで追加される各commitが trusted resulting_commit かをAPIへ問い合わせて確認する。
# 1つでも未trusted・API/auth error・曖昧ならFAIL CLOSEDにする。
#
# `pull_request_target` を使う理由:
#   `pull_request` では同一repository内のPRでも**workflow定義がPR head側から読まれる**ため、
#   PRがこのファイル自体を書き換えてACTIONS_READONLY secretを持ち出せてしまう。
#   `pull_request_target` はworkflow定義をbase branch側に固定するのでその経路が塞がる。
#
#   `pull_request_target` の一般的な危険は「PR codeをcheckoutして実行すること」だが、
#   このworkflowはPR head/merge commitのcheckout・download・script実行を**一切行わない**
#   （PR metadataの取得とAPIへのread-only問い合わせだけで成立する）。
#
# **現在このRepositoryのPRでは自動実行しない（2026-08-20）**:
#   `gate_evaluations.resulting_commit` が証明するのは Target Repository（`/workspace/target`）の
#   commitであり、このControl Repository（softwareDevelopAIteam）のPR commitとは**別RepositoryのSHA**である。
#   照合対象が異なるため、このRepositoryのPRへ適用しても常にFAILする。未完成だからではなく
#   **適用対象外**という判断であり、Control Repo用のgate evidenceは新設しない。
#   Target RepositoryにGitHub remote / push / PR経路ができた時点でそちら側へ適用し、
#   実PRでPASSを確認してからrequired化する。それまでは手動実行のみとする。
on:
  workflow_dispatch:

# GITHUB_TOKENの権限を必要最小限へ明示する。
# このworkflowはPR metadataの取得とAPIへのread-only問い合わせだけを行い、
# repositoryへの書き込み・PRコメント投稿を行わない。
permissions:
  contents: read

jobs:
  gate-evidence:
    name: Trusted Gate Evidence
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # PR head / merge commit のcheckout・download・script実行はしない。
      # 依存導入も行わず、ACTIONS_READONLY secretをPR codeへ渡さない。
      # commit列挙はGitHub標準のREST APIだけで行う（新systemを作らない）。
      # -------------------------------------------------------
      - name: Verify every commit added by this PR
        env:
          # exact verification専用のread-only credential。write権限は持たない。
          AI_TEAM_ACTIONS_READONLY_TOKEN: ${{ secrets.AI_TEAM_ACTIONS_READONLY_TOKEN }}
          AI_TEAM_API_BASE: ${{ vars.AI_TEAM_API_BASE }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${AI_TEAM_ACTIONS_READONLY_TOKEN:-}" ] || [ -z "${AI_TEAM_API_BASE:-}" ]; then
            echo "FAIL: ACTIONS_READONLY credential or API base is not configured (fail closed)"
            exit 1
          fi

          # PRで追加されるcommitだけを列挙する。
          # base branchに以前から存在するcommitは含まれない（GitHubのPR commits APIの定義）。
          commits=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')

          if [ -z "$commits" ]; then
            echo "FAIL: no commits found for this PR (fail closed)"
            exit 1
          fi

          failed=0
          for sha in $commits; do
            status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -H "Authorization: Bearer ${AI_TEAM_ACTIONS_READONLY_TOKEN}" \
              "${AI_TEAM_API_BASE}/api/gate-evaluations/verify-commit?resultingCommit=${sha}" || echo "000")

            if [ "$status" != "200" ]; then
              echo "FAIL ${sha}: verification request failed (HTTP ${status})"
              failed=1
              continue
            fi

            trusted=$(jq -r '.trusted // false' /tmp/resp.json)
            if [ "$trusted" = "true" ]; then
              echo "OK   ${sha}: trusted resulting_commit"
            else
              echo "FAIL ${sha}: not a trusted resulting_commit"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Gate Evidence Check failed: every commit in this PR must be a trusted resulting_commit"
            exit 1
          fi

          echo "All commits in this PR are trusted resulting_commits"
