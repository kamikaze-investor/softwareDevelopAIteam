name: Materiality M5 evaluation (manual)

# Design materiality detector の offline 評価（M5）を、既存の GEMINI_API_KEY secret で1バッチ実行する。
#
# - 手動起動（workflow_dispatch）だけ。PR・push では走らない。CI Meta Review の判定・終了コード・コメントには一切関与しない
# - API key は repo secret のまま detect step の環境変数にだけ渡す。ログ・成果物・Git には出さない
# - 共有 quota を守る上限: 同時実行1（concurrency + client 側の直列化・request timeout）、呼び出し間隔 20 秒以上、
#   1回の起動で最大 60 呼び出し、quota / 課金 / 認証のエラーで即停止（retry しない）、CI Meta Review の
#   run が queued / in_progress の間は待つ（最大15分）。続きは前回の run id を渡して再開する
# - 共有 key を使う以上、Meta Review への影響はゼロにはできない（CEO 判断で受容）。上の上限で最小化する
# - 評価対象の commit・mutant・凍結済み label は designMaterialityEval.ts と
#   apps/worker/scripts/materiality-eval/ が正本（2026-10-23 CEO 判断: 既存の key・project を再利用）

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Resume from the state artifact of this earlier run (empty = start fresh)'
        required: false
        default: ''
      max_calls:
        description: 'Gemini calls in this run (1-60)'
        required: false
        default: '60'
      min_interval_ms:
        description: 'Minimum interval between Gemini calls in ms (>= 20000)'
        required: false
        default: '20000'

permissions:
  contents: read
  actions: read   # 前回 run の state artifact を読むため

concurrency:
  group: materiality-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: M5 evaluation batch
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Validate bounds
        env:
          MAX_CALLS: ${{ inputs.max_calls }}
          MIN_INTERVAL_MS: ${{ inputs.min_interval_ms }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        run: |
          set -euo pipefail
          [[ "$MAX_CALLS" =~ ^[0-9]+$ ]] && [ "$MAX_CALLS" -ge 1 ] && [ "$MAX_CALLS" -le 60 ] || { echo "max_calls must be 1-60"; exit 1; }
          [[ "$MIN_INTERVAL_MS" =~ ^[0-9]+$ ]] && [ "$MIN_INTERVAL_MS" -ge 20000 ] || { echo "min_interval_ms must be >= 20000"; exit 1; }
          [ -z "$PREVIOUS_RUN_ID" ] || [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]] || { echo "previous_run_id must be numeric"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mutant と known positive の e405c7c7 は PR #404 の branch 上にだけある（master には squash で入った）
      - name: Fetch PR #404 head for e405c7c7
        run: git fetch --no-tags origin refs/pull/404/head

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore state from the previous run
        if: inputs.previous_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: materiality-eval-state
          path: ${{ runner.temp }}/m5
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Prepare frame, mutants and frozen labels
        env:
          OUT: ${{ runner.temp }}/m5
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cd apps/worker
          # 再開なのに label が無い state（label を固定する前の artifact）からは続けない
          if [ -n "$PREVIOUS_RUN_ID" ] && [ ! -f "$OUT/labels.json" ]; then
            echo "restored state has no labels.json; start fresh instead of resuming"; exit 1
          fi
          if [ ! -f "$OUT/frame.json" ]; then
            pnpm exec tsx scripts/designMaterialityEval.ts frame --repo "$GITHUB_WORKSPACE" --head bbe3b746 --out "$OUT"
          fi
          if [ ! -f "$OUT/mutants.json" ]; then
            pnpm exec tsx scripts/designMaterialityEval.ts mutants --repo "$GITHUB_WORKSPACE" --out "$OUT"
          fi
          # 再開時は前回の label と同じでなければ止める（別の label で集計が混ざらないように）
          if [ -f "$OUT/labels.json" ]; then
            cmp -s scripts/materiality-eval/labels-2026-10-23.json "$OUT/labels.json" || { echo "frozen labels changed since the previous run"; exit 1; }
          fi
          cp scripts/materiality-eval/labels-2026-10-23.json "$OUT/labels.json"

      - name: Detect (bounded)
        env:
          OUT: ${{ runner.temp }}/m5
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # CI Meta Review と同じ model 解決（vars.GEMINI_MODEL、未設定なら gemini-2.5-flash）
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # Meta Review が走っている間は待つ（共有 key を同時に使わない）。actions: read だけの token
          GITHUB_TOKEN: ${{ github.token }}
          MAX_CALLS: ${{ inputs.max_calls }}
          MIN_INTERVAL_MS: ${{ inputs.min_interval_ms }}
        run: |
          set -euo pipefail
          cd apps/worker
          pnpm exec tsx scripts/designMaterialityEval.ts detect --repo "$GITHUB_WORKSPACE" --out "$OUT" \
            --max-calls "$MAX_CALLS" --min-interval-ms "$MIN_INTERVAL_MS" --yield-to-workflow meta-review.yml | tee "$OUT/detect.log"

      - name: Score
        if: always()
        env:
          OUT: ${{ runner.temp }}/m5
        run: |
          set -euo pipefail
          cd apps/worker
          if [ -f "$OUT/results.jsonl" ]; then
            pnpm exec tsx scripts/designMaterialityEval.ts score --out "$OUT" --labels "$OUT/labels.json" > /dev/null
            echo "### M5 batch" >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 "$OUT/detect.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo "results: $(wc -l < "$OUT/results.jsonl") records, API errors: $( [ -f "$OUT/errors.jsonl" ] && wc -l < "$OUT/errors.jsonl" || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materiality-eval-state
          path: |
            ${{ runner.temp }}/m5/frame.json
            ${{ runner.temp }}/m5/labels.json
            ${{ runner.temp }}/m5/mutants.json
            ${{ runner.temp }}/m5/results.jsonl
            ${{ runner.temp }}/m5/errors.jsonl
            ${{ runner.temp }}/m5/report.json
            ${{ runner.temp }}/m5/detect.log
          if-no-files-found: ignore
          retention-days: 30
