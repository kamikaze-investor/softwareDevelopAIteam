name: Meta Review (Gemini)

# PRがmainにマージされる前に必ず実行する
# blocked → CI失敗 → マージ不可（Branch Protection で Required に設定すること）
on:
  pull_request:
    branches: [master, main]   # master（現在）と main（将来の改名）の両方に対応

permissions:
  pull-requests: write     # PRへのコメント投稿
  contents: read
  copilot-requests: write  # Gemini API/CLI 両方 quota 枯渇時の Copilot CLI フォールバック用

jobs:
  meta-review:
    name: Meta Reviewer AI (Gemini)
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. チェックアウト（全履歴取得 = diffのため）
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare workspace paths
        run: |
          sudo mkdir -p /workspace
          if [ ! -e /workspace/control ]; then
            sudo ln -s "$GITHUB_WORKSPACE" /workspace/control
          fi

      # -------------------------------------------------------
      # 2. Node.js + pnpm のセットアップ
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -------------------------------------------------------
      # 2.5. Copilot CLI のセットアップ（Gemini API/CLI 両方 quota 枯渇時のみ使用）
      # -------------------------------------------------------
      - name: Install Copilot CLI
        # 独立レビュー指摘: これが失敗しても Gemini 経路の可用性を道連れにしない
        # （Gemini が正常なら Copilot は一度も呼ばれないため、install失敗自体はnon-fatal。
        # 実際に Copilot が必要になったのに未インストールなら、copilotRouter.ts の
        # spawnSync が ENOENT 相当のエラーを投げ、blocked として正しく表面化する）。
        continue-on-error: true
        run: npm install -g @github/copilot

      # -------------------------------------------------------
      # 3. Meta Review 実行（Gemini → Gemini CLI → Copilot CLI の順にフォールバック）
      # -------------------------------------------------------
      - name: Run Meta Review
        id: meta-review
        run: pnpm --filter @ai-team/worker exec tsx src/metaReviewer/autoReview.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # Copilot CLI フォールバック用（PAT不要、実測確認済み）
          BASE_SHA:  ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          PR_TITLE:  ${{ github.event.pull_request.title }}
          TASK_ID:   "pr-${{ github.event.pull_request.number }}"
          META_REVIEW_RESULT_PATH: ${{ github.workspace }}/meta-review-result.json
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

      # -------------------------------------------------------
      # 4. 結果をPRにコメント投稿（always = blocked時も投稿）
      # -------------------------------------------------------
      - name: Post Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')

            // autoReview.ts が meta-review-result.json を書き出す
            let result
            try {
              result = JSON.parse(fs.readFileSync('meta-review-result.json', 'utf-8'))
            } catch {
              // ファイルが存在しない = 実行前にエラーで落ちた
              result = {
                status: 'blocked',
                riskLevel: 'critical',
                summary: 'Meta Review の実行自体に失敗しました。ログを確認してください。',
                findings: [],
                requiresCeoApproval: true,
              }
            }

            const statusEmoji = {
              approved:           '✅',
              changes_requested:  '⚠️',
              blocked:            '🚫',
            }
            const emoji = statusEmoji[result.status] ?? '❓'

            const findingsSection = result.findings.length > 0
              ? [
                  '',
                  '### 検出事項',
                  ...result.findings.map(f => {
                    const lines = [`- **[${f.severity}]** ${f.message}`]
                    if (f.suggestion) lines.push(`  > 💡 ${f.suggestion}`)
                    return lines.join('\n')
                  }),
                ].join('\n')
              : '\n*検出事項なし*'

            const ceoNote = result.requiresCeoApproval
              ? '\n\n> 🔴 **CEO承認が必要です。** このPRはマージ不可です。'
              : ''

            // providerUsed は autoReview.ts が additive に書き込む監査証跡（2026-08-26追加）。
            // 未設定（古い結果ファイル・エラー時）は従来どおり Gemini 表記にフォールバックする。
            const reviewedBy = result.providerUsed === 'copilot'
              ? 'GitHub Copilot CLI (Microsoft mai-code-1.1-flash) — Gemini quota exhausted fallback'
              : 'Gemini (Meta Reviewer AI)'

            const body = [
              `## ${emoji} Meta Review — ${result.status.toUpperCase()}`,
              '',
              `| 項目 | 内容 |`,
              `|---|---|`,
              `| 判定 | **${result.status}** |`,
              `| リスク | ${result.riskLevel} |`,
              `| 対象エリア | ${result.targetArea ?? '—'} |`,
              '',
              `### サマリー`,
              result.summary,
              findingsSection,
              ceoNote,
              '',
              `---`,
              `*Reviewed by ${reviewedBy} — [ログを確認](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n')

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            })
